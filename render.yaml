# ============================================================
# Render blueprint — the Express backend ONLY.
#
# Render grants 750 free instance-hours per WORKSPACE per month. A month is
# ~730 hours, so exactly one always-available service fits; two would not.
# That is why the AI service lives on Hugging Face Spaces instead (which also
# gives it 16GB RAM instead of 512MB) and the frontend on Cloudflare Pages.
#
# Free services spin down after 15 minutes idle and take ~1 minute to wake.
# Do NOT add a keep-alive pinger: staying awake 24/7 would burn the 750 hours.
#
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Values marked `sync: false` are secrets and are set in the dashboard.
# ============================================================
services:
  - type: web
    name: sounak-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: sounak-backend
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected by Render. server.js already reads process.env.PORT
      # and listens on all interfaces, so no code change is needed.
      - key: MONGO_URI
        sync: false          # MongoDB Atlas
      - key: POSTGRES_URL
        sync: false          # Neon
      - key: JWT_SECRET
        sync: false
      - key: AI_SERVICE_URL
        sync: false          # https://<user>-sounak-ai-service.hf.space
      - key: AI_INTERNAL_KEY
        sync: false          # must match INTERNAL_API_KEY on the AI service
      - key: AI_TIMEOUT_MS
        value: "60000"       # raised: the AI service may be waking up
      - key: CORS_ORIGIN
        sync: false          # https://<project>.pages.dev,http://localhost
      # Redis and RabbitMQ are intentionally unset. Both degrade gracefully:
      # redis.config.js disables caching and stops retrying; rabbitmq.config.js
      # retries without crashing. Same as on the old EC2 box.
