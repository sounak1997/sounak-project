<div class="page login">
  <div class="wrap">
    <div class="card">
      <h2 class="title">Sign in</h2>
      <div class="accent-bar accent-bar--left"></div>

      @if (error()) {
        <div class="alert alert--error mt">{{ error() }}</div>
      }

      <div class="field">
        <label for="identifier">Mobile number or email</label>
        <input
          id="identifier"
          type="text"
          inputmode="text"
          autocapitalize="none"
          autocorrect="off"
          autocomplete="username"
          placeholder="e.g. 9609987874"
          [ngModel]="identifier()"
          (ngModelChange)="identifier.set($event)"
          (keyup.enter)="submit()" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          (keyup.enter)="submit()" />
      </div>

      <button class="btn" [disabled]="busy()" (click)="submit()">
        {{ busy() ? 'Signing in…' : 'Sign in' }}
      </button>

      <p class="muted small mt">
        <a routerLink="/reset-password">Forgot your password?</a>
      </p>
      <p class="muted small">
        New here? <a routerLink="/signup">Create your login</a> using the member
        code your gym gave you.
      </p>
      <p class="muted small">
        You never need to sign in just to mark attendance — scanning the QR at
        the gym is enough on its own.
      </p>
    </div>
  </div>
</div>
