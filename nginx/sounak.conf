server {
    listen 80;

    # Document uploads for RAG. The AI service caps files at 10MB; the extra
    # headroom covers multipart encoding overhead. Without this, nginx's 1MB
    # default rejects uploads with a 413 before they ever reach the backend.
    client_max_body_size 12M;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/notifications/stream {
        proxy_pass http://localhost:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # AI chat streaming (SSE). Buffering MUST be off or nginx holds the whole
    # reply and the "types itself out" effect is lost — the user waits, then
    # gets everything at once.
    location /api/ai/chat/stream {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Other AI endpoints. Retrieval + generation (and embedding a freshly
    # uploaded document) can take far longer than a normal API call, so the
    # default 60s read timeout is raised.
    location /api/ai/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
